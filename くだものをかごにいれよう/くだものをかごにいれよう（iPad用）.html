<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>くだものをカゴにいれよう！</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', sans-serif;
    background: #d4f5a0; overflow: hidden;
    height: 100vh; width: 100vw; user-select: none;
  }
  #bg {
    position: fixed; inset: 0; z-index: 0;
    background: linear-gradient(180deg,#a8e4ff 0%,#c8f0ff 35%,#d4f5a0 65%,#8fce55 100%);
  }
  #bg::before {
    content:''; position:absolute; top:30px; right:80px;
    width:90px; height:90px;
    background:radial-gradient(circle,#ffe566 60%,#ffc93c 100%);
    border-radius:50%; box-shadow:0 0 40px 20px #fff8a0aa;
  }
  .ground {
    position:absolute; bottom:0; left:0; right:0; height:120px;
    background:linear-gradient(180deg,#8fce55 0%,#6ab030 100%);
    border-radius:60% 60% 0 0/30% 30% 0 0;
  }
  .tree { position:absolute; bottom:80px; }
  .tree-trunk { width:28px; height:70px; background:linear-gradient(90deg,#8b5e3c,#a0703a,#8b5e3c); border-radius:8px; margin:0 auto; }
  .tree-top { width:90px; height:90px; border-radius:50%; position:relative; margin:0 auto; top:10px; }
  .tree-top::before,.tree-top::after { content:''; position:absolute; border-radius:50%; }
  .tree-top::before { width:70px; height:70px; top:-20px; left:5px; }
  .tree-top::after  { width:65px; height:65px; top:0; left:20px; }
  .tree1 .tree-top { background:#5dba3a; }
  .tree1 .tree-top::before { background:#4ca82c; }
  .tree1 .tree-top::after  { background:#6acc44; }
  .tree2 .tree-top { background:#e8a020; }
  .tree2 .tree-top::before { background:#d4901a; }
  .tree2 .tree-top::after  { background:#f0b030; }
  .tree3 .tree-top { background:#5dba3a; }
  .tree3 .tree-top::before { background:#6acc44; }
  .tree3 .tree-top::after  { background:#4ca82c; }
  .flower { position:absolute; font-size:22px; bottom:95px; }
  .grass  { position:absolute; bottom:80px; font-size:18px; opacity:0.7; }
  .cloud  { position:absolute; background:white; border-radius:50px; opacity:0.85; }

  /* UI */
  #ui { position:relative; z-index:10; width:100%; height:100vh; display:flex; flex-direction:column; }
  #top-bar {
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 20px; background:rgba(255,255,255,0.55);
    backdrop-filter:blur(6px); border-bottom:3px solid rgba(255,255,255,0.7);
    flex-shrink:0;
  }
  #title { font-size:clamp(18px,3vw,26px); font-weight:900; color:#2d7a00; text-shadow:2px 2px 0 #fff; letter-spacing:2px; }
  #fruit-select { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .fruit-btn {
    font-size:clamp(22px,4vw,32px); background:white; border:3px solid #aae060;
    border-radius:16px; padding:6px 10px; cursor:pointer;
    transition:transform 0.15s,box-shadow 0.15s,border-color 0.15s;
    box-shadow:0 3px 8px #0002; line-height:1;
  }
  .fruit-btn:hover,.fruit-btn.active { transform:scale(1.15); box-shadow:0 6px 18px #0003; border-color:#ff9b2e; background:#fff8e8; }
  .fruit-btn:focus { outline:4px solid #ff7700; outline-offset:3px; }
  .fruit-btn.active { background:#fff3d0; border-color:#ffaa00; }
  #score-display {
    font-size:clamp(16px,2.5vw,22px); font-weight:800; color:#b05000;
    background:rgba(255,255,255,0.7); border-radius:14px;
    padding:6px 14px; border:2px solid #ffcc88; white-space:nowrap;
  }

  /* ゲームエリア */
  #game-area { position:relative; flex:1; overflow:hidden; cursor:pointer; }
  #game-area:focus { outline:6px solid #ff7700; outline-offset:-6px; }
  #prompt {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-size:clamp(20px,4vw,36px); font-weight:900; color:#2d7a00;
    text-shadow:2px 2px 0 #fff,0 0 20px #ffffffcc;
    text-align:center; pointer-events:none;
    transition:opacity 0.5s; animation:pulse 2s ease-in-out infinite;
    line-height:1.6; z-index:50;
  }
  @keyframes pulse {
    0%,100% { transform:translate(-50%,-50%) scale(1); opacity:1; }
    50%      { transform:translate(-50%,-50%) scale(1.06); opacity:0.75; }
  }
  .fruit {
    position:absolute; line-height:1; pointer-events:none; will-change:transform;
    filter:drop-shadow(0 8px 16px rgba(0,0,0,0.25));
    animation:floatDown linear forwards,sway ease-in-out infinite;
  }
  @keyframes floatDown {
    0%   { top:-140px; opacity:0; }
    8%   { opacity:1; }
    85%  { opacity:1; }
    100% { top:calc(100% - 190px); opacity:0.3; }
  }
  @keyframes sway {
    0%   { margin-left:0; }
    25%  { margin-left:18px; }
    75%  { margin-left:-18px; }
    100% { margin-left:0; }
  }

  /* カゴ */
  #basket-area {
    position:absolute; bottom:60px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; z-index:20;
  }
  #basket-fruits {
    display:flex; justify-content:center; gap:4px;
    min-height:80px; align-items:flex-end; margin-bottom:4px;
  }
  .basket-fruit {
    font-size:clamp(40px,7vw,65px); line-height:1;
    animation:popIn 0.4s cubic-bezier(.36,1.8,.6,1) forwards;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,0.2));
  }
  @keyframes popIn {
    0%   { transform:scale(0) rotate(-20deg); opacity:0; }
    100% { transform:scale(1) rotate(0deg); opacity:1; }
  }
  #basket-svg { width:clamp(180px,30vw,280px); height:auto; filter:drop-shadow(0 6px 12px rgba(0,0,0,0.25)); }
  #basket-svg.shake { animation:basketShake 0.5s ease-in-out; }
  @keyframes basketShake {
    0%,100% { transform:rotate(0); }
    20% { transform:rotate(-6deg); }
    40% { transform:rotate(6deg); }
    60% { transform:rotate(-4deg); }
    80% { transform:rotate(4deg); }
  }
  .click-ripple {
    position:absolute; border-radius:50%; background:rgba(255,200,50,0.5);
    pointer-events:none; animation:ripple 0.6s ease-out forwards;
    transform:translate(-50%,-50%); z-index:30;
  }
  @keyframes ripple {
    0%   { width:0; height:0; opacity:1; }
    100% { width:200px; height:200px; opacity:0; }
  }

  /* お祝い */
  #celebration {
    position:fixed; inset:0; z-index:100;
    display:none; justify-content:center; align-items:center; flex-direction:column;
    background:rgba(255,255,128,0.82); backdrop-filter:blur(6px);
  }
  #celebration.show { display:flex; }
  #celebration-text {
    font-size:clamp(36px,7vw,72px); font-weight:900; color:#d44000;
    text-shadow:3px 3px 0 #fff,0 0 30px #ffcc00;
    animation:celebPop 0.6s cubic-bezier(.36,1.8,.6,1);
    text-align:center; line-height:1.35;
  }
  #celebration-fruits {
    font-size:clamp(40px,6vw,60px); margin-top:10px;
    animation:celebPop 0.6s 0.2s both cubic-bezier(.36,1.8,.6,1);
  }
  @keyframes celebPop {
    0%   { transform:scale(0); }
    100% { transform:scale(1); }
  }

  /* やる？ダイアログ */
  #retry-dialog {
    display:none; flex-direction:column; align-items:center;
    margin-top:28px;
  }
  #retry-dialog.show { display:flex; animation:celebPop 0.5s cubic-bezier(.36,1.8,.6,1); }
  #retry-question {
    font-size:clamp(24px,4.5vw,42px); font-weight:900; color:#2d5a00;
    text-shadow:2px 2px 0 #fff; margin-bottom:22px; text-align:center;
  }
  .retry-btns { display:flex; gap:28px; flex-wrap:wrap; justify-content:center; }
  .retry-btn {
    font-size:clamp(24px,4.5vw,40px); font-weight:900;
    padding:20px 52px; border:none; border-radius:60px; cursor:pointer;
    transition:transform 0.15s,box-shadow 0.15s;
    box-shadow:0 6px 20px #0003;
  }
  .retry-btn:focus { outline:5px solid #fff; outline-offset:4px; }
  #btn-yes { background:linear-gradient(135deg,#44dd44,#22aa22); color:white; box-shadow:0 6px 20px #22aa2255; }
  #btn-yes:hover,#btn-yes:focus { transform:scale(1.1); }
  #btn-no  { background:linear-gradient(135deg,#ff8844,#ff4400); color:white; box-shadow:0 6px 20px #ff440055; }
  #btn-no:hover,#btn-no:focus { transform:scale(1.1); }

  /* がんばって / またあそびに */
  #farewell-screen {
    position:fixed; inset:0; z-index:200;
    display:none; justify-content:center; align-items:center; flex-direction:column;
    background:rgba(200,240,255,0.92); backdrop-filter:blur(10px);
  }
  #farewell-screen.show { display:flex; }
  #farewell-text {
    font-size:clamp(44px,9vw,100px); font-weight:900;
    text-align:center; line-height:1.3;
    animation:farewellPop 0.7s cubic-bezier(.36,1.8,.6,1);
  }
  #farewell-emoji {
    font-size:clamp(60px,10vw,110px); margin-top:10px;
    animation:farewellPop 0.7s 0.15s both cubic-bezier(.36,1.8,.6,1);
  }
  @keyframes farewellPop {
    0%   { transform:scale(0) rotate(-10deg); opacity:0; }
    100% { transform:scale(1) rotate(0deg); opacity:1; }
  }

  /* 紙吹雪 */
  .confetti {
    position:fixed; width:12px; height:12px; border-radius:3px;
    z-index:99; pointer-events:none; animation:confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { transform:translateY(-20px) rotate(0deg); opacity:1; }
    100% { transform:translateY(110vh) rotate(720deg); opacity:0; }
  }
  @media(max-width:500px){
    .fruit-btn { font-size:20px; padding:4px 7px; }
    #title { font-size:15px; }
  }
</style>
</head>
<body>

<div id="bg">
  <div class="cloud" style="width:120px;height:44px;top:55px;left:10%;"></div>
  <div class="cloud" style="width:90px;height:34px;top:70px;left:12%;"></div>
  <div class="cloud" style="width:150px;height:50px;top:30px;left:38%;"></div>
  <div class="cloud" style="width:100px;height:38px;top:20px;left:62%;"></div>
  <div class="tree tree1" style="left:4%"><div class="tree-top"></div><div class="tree-trunk"></div></div>
  <div class="tree tree2" style="left:16%"><div class="tree-top"></div><div class="tree-trunk"></div></div>
  <div class="tree tree3" style="right:15%"><div class="tree-top"></div><div class="tree-trunk"></div></div>
  <div class="tree tree1" style="right:3%"><div class="tree-top"></div><div class="tree-trunk"></div></div>
  <div class="ground"></div>
  <span class="flower" style="left:28%">🌸</span>
  <span class="flower" style="left:42%">🌼</span>
  <span class="flower" style="right:28%">🌸</span>
  <span class="grass" style="left:35%">🌿</span>
  <span class="grass" style="right:35%">🌿</span>
  <span class="grass" style="left:55%">🍀</span>
</div>

<div id="ui">
  <div id="top-bar">
    <div id="title">🍎 くだものをカゴにいれよう！</div>
    <div id="fruit-select">
      <button class="fruit-btn active" data-fruit="🍎" data-name="りんご"       aria-label="りんご"       tabindex="1">🍎</button>
      <button class="fruit-btn"        data-fruit="🍓" data-name="いちご"       aria-label="いちご"       tabindex="2">🍓</button>
      <button class="fruit-btn"        data-fruit="🍇" data-name="ぶどう"       aria-label="ぶどう"       tabindex="3">🍇</button>
      <button class="fruit-btn"        data-fruit="🍌" data-name="ばなな"       aria-label="ばなな"       tabindex="4">🍌</button>
      <button class="fruit-btn"        data-fruit="🍐" data-name="ようなし"     aria-label="ようなし"     tabindex="5">🍐</button>
      <button class="fruit-btn"        data-fruit="🍊" data-name="みかん"       aria-label="みかん"       tabindex="6">🍊</button>
      <button class="fruit-btn"        data-fruit="🍍" data-name="ぱいなっぷる" aria-label="ぱいなっぷる" tabindex="7">🍍</button>
      <button class="fruit-btn"        data-fruit="🍑" data-name="もも"         aria-label="もも"         tabindex="8">🍑</button>
      <button class="fruit-btn"        data-fruit="🍏" data-name="あおりんご"   aria-label="あおりんご"   tabindex="9">🍏</button>
      <button class="fruit-btn"        data-fruit="🍈" data-name="まくわうり"   aria-label="まくわうり"   tabindex="10">🍈</button>
    </div>
    <div id="score-display">✨ <span id="score">0</span> こ</div>
  </div>

  <div id="game-area" tabindex="0" role="button" aria-label="クリックして果物を落とす">
    <div id="prompt">
      ここを<br>おしてね！<br>
      <span style="font-size:0.55em;color:#5a9a00;">（クリック・スペース・エンター）</span>
    </div>
    <div id="basket-area">
      <div id="basket-fruits"></div>
      <svg id="basket-svg" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="55" rx="85" ry="20" fill="#c8820a" opacity="0.3"/>
        <path d="M20 55 Q30 130 100 138 Q170 130 180 55 Z" fill="#e8a820"/>
        <path d="M26 75 Q100 90 174 75" stroke="#c8780a" stroke-width="2.5" fill="none"/>
        <path d="M22 95 Q100 113 178 95" stroke="#c8780a" stroke-width="2.5" fill="none"/>
        <path d="M24 115 Q100 130 176 115" stroke="#c8780a" stroke-width="2.5" fill="none"/>
        <line x1="60"  y1="58" x2="50"  y2="132" stroke="#c8780a" stroke-width="2"/>
        <line x1="80"  y1="58" x2="74"  y2="136" stroke="#c8780a" stroke-width="2"/>
        <line x1="100" y1="58" x2="100" y2="138" stroke="#c8780a" stroke-width="2"/>
        <line x1="120" y1="58" x2="126" y2="136" stroke="#c8780a" stroke-width="2"/>
        <line x1="140" y1="58" x2="150" y2="132" stroke="#c8780a" stroke-width="2"/>
        <ellipse cx="100" cy="55" rx="85" ry="20" fill="#d08820" stroke="#b06000" stroke-width="3"/>
        <path d="M38 50 Q40 15 100 12 Q160 15 162 50" stroke="#b06000" stroke-width="7" fill="none" stroke-linecap="round"/>
        <ellipse cx="100" cy="55" rx="55" ry="9" fill="rgba(255,255,200,0.25)"/>
      </svg>
    </div>
  </div>
</div>

<!-- お祝い -->
<div id="celebration" role="dialog" aria-modal="true">
  <div id="celebration-text"></div>
  <div id="celebration-fruits"></div>
  <div id="retry-dialog">
    <div id="retry-question">もういちど やる？</div>
    <div class="retry-btns">
      <button id="btn-yes" class="retry-btn" tabindex="0">🌟 やる！</button>
      <button id="btn-no"  class="retry-btn" tabindex="0">👋 おわり</button>
    </div>
  </div>
</div>

<!-- がんばって！ / またあそびにきてね！ -->
<div id="farewell-screen" role="dialog" aria-modal="true">
  <div id="farewell-text"></div>
  <div id="farewell-emoji"></div>
</div>

<script>
(function(){
  /* ============================================================
     Web Audio API — 合成音
  ============================================================ */
  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, type, duration, vol, delay) {
    try {
      const ctx  = getAudio();
      const t    = ctx.currentTime + (delay || 0);
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
      osc.start(t);
      osc.stop(t + duration + 0.02);
    } catch(e) {}
  }

  // 落下音：フワ〜っと風+キラキラ
  function soundFall() {
    try {
      const ctx = getAudio();
      const t   = ctx.currentTime;
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, t);
      osc.frequency.exponentialRampToValueAtTime(400, t + 1.2);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.13, t + 0.2);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
      osc.start(t); osc.stop(t + 1.5);
    } catch(e) {}
    [0, 0.1, 0.22].forEach((d, i) => playTone(1000 + i*300, 'sine', 0.25, 0.06, d));
  }

  // カゴに入る音：ポーン♪木琴
  function soundCatch() {
    [523, 659, 784].forEach((f, i) => playTone(f, 'sine', 0.5, 0.18, i * 0.11));
    playTone(1568, 'sine', 0.25, 0.07, 0.04);
  }

  // ファンファーレ
  function soundFanfare() {
    const mel = [
      {f:523,d:0.17},{f:659,d:0.17},{f:784,d:0.17},
      {f:1047,d:0.32},{f:988,d:0.1},{f:1047,d:0.38}
    ];
    let t = 0;
    mel.forEach(n => {
      playTone(n.f, 'sine', n.d+0.1, 0.2, t);
      playTone(n.f*1.5, 'sine', n.d, 0.06, t);
      t += n.d + 0.04;
    });
    [0.1,0.25,0.4,0.55].forEach((d,i) => playTone(1100+i*240,'sine',0.22,0.07,d));
  }

  // 「やる！」音
  function soundGoGo() {
    [523,659,784,1047].forEach((f,i) => playTone(f,'sine',0.28,0.18,i*0.1));
  }

  // 「おわり」音
  function soundBye() {
    [784,659,523,392].forEach((f,i) => playTone(f,'sine',0.38,0.16,i*0.13));
  }

  /* ============================================================
     音声合成（SpeechSynthesis）— コールバック不要の時間制御版
  ============================================================ */
  function speak(text) {
    if (!window.speechSynthesis) return;
    // 前の発話をキャンセル
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang   = 'ja-JP';
    utter.rate   = 1.05;
    utter.pitch  = 2.0;
    utter.volume = 1.0;
    // 日本語の優しい声を選ぶ
    const trySetVoice = () => {
      const voices = window.speechSynthesis.getVoices();
      const jaVoice = voices.find(v =>
        v.lang.startsWith('ja') && /kyoko|o-ren|ichiro|female|haruka|nanami/i.test(v.name)
      ) || voices.find(v => v.lang.startsWith('ja'));
      if (jaVoice) utter.voice = jaVoice;
      window.speechSynthesis.speak(utter);
    };
    // 声リストが未ロードの場合は少し待つ
    if (window.speechSynthesis.getVoices().length > 0) {
      trySetVoice();
    } else {
      window.speechSynthesis.onvoiceschanged = trySetVoice;
      setTimeout(trySetVoice, 300); // フォールバック
    }
  }

  /* ============================================================
     ゲーム状態
  ============================================================ */
  const MAX_BASKET       = 3;
  const FALL_DURATION_MS = 5000;

  let currentFruit = '🍎';
  let currentName  = 'りんご';
  let basketCount  = 0;
  let totalScore   = 0;
  let falling      = false;

  const gameArea       = document.getElementById('game-area');
  const basketEl       = document.getElementById('basket-fruits');
  const basketSvg      = document.getElementById('basket-svg');
  const promptEl       = document.getElementById('prompt');
  const scoreEl        = document.getElementById('score');
  const celebEl        = document.getElementById('celebration');
  const celebText      = document.getElementById('celebration-text');
  const celebFruits    = document.getElementById('celebration-fruits');
  const retryDialog    = document.getElementById('retry-dialog');
  const btnYes         = document.getElementById('btn-yes');
  const btnNo          = document.getElementById('btn-no');
  const farewellScreen = document.getElementById('farewell-screen');
  const farewellText   = document.getElementById('farewell-text');
  const farewellEmoji  = document.getElementById('farewell-emoji');
  const fruitBtns      = document.querySelectorAll('.fruit-btn');

  /* ---- 果物選択 ---- */
  fruitBtns.forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      fruitBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFruit = btn.dataset.fruit;
      currentName  = btn.dataset.name;
    });
    btn.addEventListener('keydown', e => {
      if (e.key==='Enter'||e.key===' '){e.preventDefault();btn.click();}
    });
  });

  /* ---- ゲームエリア操作 ---- */
  gameArea.addEventListener('click', handleAction);
  gameArea.addEventListener('keydown', e => {
    if (e.key===' '||e.key==='Enter'){e.preventDefault();handleAction(e);}
  });

  function handleAction(e) {
    if (celebEl.classList.contains('show')) return;
    if (falling) return;
    getAudio(); // AudioContext を起動
    const rect   = gameArea.getBoundingClientRect();
    const clickX = (e.clientX != null ? e.clientX : rect.left + rect.width/2) - rect.left;
    promptEl.style.opacity = '0';
    spawnRipple(clickX, 50);
    soundFall();
    dropFruit(clickX);
  }

  /* ---- 果物落下 ---- */
  function dropFruit(xPos) {
    falling = true;
    const fruit = document.createElement('div');
    fruit.classList.add('fruit');
    fruit.textContent = currentFruit;
    const areaW     = gameArea.clientWidth;
    const fruitSize = Math.min(110, Math.max(60, areaW * 0.11));
    const left      = Math.min(Math.max(xPos - fruitSize/2, 20), areaW - fruitSize - 20);
    fruit.style.left             = left + 'px';
    fruit.style.fontSize         = fruitSize + 'px';
    fruit.style.animationDuration= `${FALL_DURATION_MS}ms,${FALL_DURATION_MS*0.4}ms`;
    gameArea.appendChild(fruit);
    setTimeout(() => {
      fruit.remove();
      falling = false;
      addToBasket();
    }, FALL_DURATION_MS - 200);
  }

  function resetGame() {

    falling = false;

  /* ---- 波紋 ---- */
  function spawnRipple(x, y) {
    const r = document.createElement('div');
    r.classList.add('click-ripple');
    r.style.left = x + 'px';
    r.style.top  = (y + 50) + 'px';
    gameArea.appendChild(r);
    r.addEventListener('animationend', () => r.remove());
  }

  /* ---- 紙吹雪 ---- */
  const confettiColors = ['#ff4e4e','#ffcc00','#4eaaff','#44dd88','#ff88cc','#aa66ff'];
  let confettiEls = [];
  function spawnConfetti() {
    for (let i = 0; i < 70; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.classList.add('confetti');
        el.style.left             = Math.random()*100 + 'vw';
        el.style.background       = confettiColors[Math.floor(Math.random()*confettiColors.length)];
        el.style.animationDuration= (2 + Math.random()*2.5) + 's';
        el.style.borderRadius     = Math.random()>0.5 ? '50%' : '3px';
        document.body.appendChild(el);
        confettiEls.push(el);
        el.addEventListener('animationend', () => el.remove());
      }, i * 35);
    }
  }
  function removeConfetti() {
    confettiEls.forEach(el => el.remove());
    confettiEls = [];
  }

  gameArea.focus();

function playVoice(id) {
  const audio = document.getElementById(id);
  if (!audio) return;
  audio.currentTime = 0;
  audio.play();
}
