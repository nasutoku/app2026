<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>しりとりあそび</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F2F6FF;
    --bg2: #E8F3FF;
    --coral: #FF6F91;
    --coral-deep: #E8547A;
    --sky: #35B4C4;
    --sun: #FFC93C;
    --grass: #4CAF82;
    --ink: #263457;
    --ink-soft: #5C6889;
    --card: #FFFFFF;
    --line: #DDE6FA;
    --shadow: 0 10px 24px rgba(38,52,87,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Zen Maru Gothic', sans-serif;
    background:
      radial-gradient(circle at 8% 12%, rgba(255,201,60,0.20) 0, transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(53,180,196,0.18) 0, transparent 45%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    color:var(--ink);
    min-height:100vh;
    padding:20px 14px 60px;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:640px;
  }
  header{
    text-align:center;
    margin-bottom:18px;
  }
  header h1{
    font-family:'Kosugi Maru', sans-serif;
    font-size:32px;
    margin:0;
    color:var(--ink);
    letter-spacing:2px;
    text-shadow: 3px 3px 0 rgba(255,201,60,0.55);
  }
  .scoreboard{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .pill{
    background:var(--card);
    border-radius:999px;
    padding:8px 16px;
    font-size:13px;
    font-weight:700;
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .pill.player{color:var(--coral-deep);}
  .pill.bot{color:var(--sky);}

  .connector{ display:none; }
  .kana-node{
    width:56px;height:56px;
    border-radius:50%;
    background:var(--card);
    display:flex;align-items:center;justify-content:center;
    font-family:'Kosugi Maru', sans-serif;
    font-size:26px;
    box-shadow:var(--shadow);
    border:3px solid var(--line);
    transition:all .25s ease;
  }
  .kana-node.active{
    border-color:var(--sun);
    background:#FFF7E0;
    transform:scale(1.08);
  }
  .kana-node.bad{border-color:var(--coral); background:#FFECEF; color:var(--coral-deep); animation:shake .35s;}

  .stage{
    background:var(--card);
    border-radius:28px;
    box-shadow:var(--shadow);
    padding:28px 20px 22px;
    text-align:center;
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
  }
  .stage::before{
    content:"";
    position:absolute; top:-40px; right:-40px;
    width:120px;height:120px;border-radius:50%;
    background:rgba(255,201,60,0.18);
  }
  .stage-tag{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    padding:4px 12px;
    border-radius:999px;
    margin-bottom:10px;
  }
  .stage-tag.player{background:#FFE3EA; color:var(--coral-deep);}
  .stage-tag.bot{background:#DEF6F8; color:var(--sky);}
  .stage-emoji{
    font-size:76px;
    line-height:1;
    margin:6px 0 10px;
    filter:drop-shadow(0 8px 10px rgba(38,52,87,0.15));
  }
  .stage-word{
    font-family:'Kosugi Maru', sans-serif;
    font-size:34px;
    letter-spacing:3px;
    color:var(--ink);
  }
  .stage-word .lastchar{color:var(--coral-deep);}

  .chain-wrap{ margin-bottom:18px; }
  .chain-label{ font-size:12px; color:var(--ink-soft); margin:0 0 8px 4px; font-weight:700; }
  .chain{
    display:flex;
    gap:0;
    overflow-x:auto;
    padding:6px 2px 12px;
    scrollbar-width:thin;
  }
  .chain-item{ flex:0 0 auto; display:flex; align-items:center; }
  .chain-card{
    background:var(--card);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:8px 10px;
    text-align:center;
    min-width:64px;
  }
  .chain-card .em{font-size:22px;}
  .chain-card .wd{font-size:11px; font-family:'Kosugi Maru',sans-serif; color:var(--ink-soft); margin-top:2px; white-space:nowrap;}
  .chain-card.by-player{border:2px solid var(--coral);}
  .chain-card.by-bot{border:2px solid var(--sky);}
  .link{ font-size:16px; color:#C6D2EE; margin:0 4px; }

  .input-row{ display:flex; gap:8px; margin-bottom:8px; }
  input[type="text"]{
    flex:1;
    font-family:'Kosugi Maru', sans-serif;
    font-size:20px;
    padding:14px 16px;
    border-radius:16px;
    border:2px solid var(--line);
    outline:none;
    background:var(--card);
    color:var(--ink);
    letter-spacing:2px;
  }
  input[type="text"]:focus{border-color:var(--sun);}
  button{ font-family:'Zen Maru Gothic', sans-serif; font-weight:700; border:none; cursor:pointer; border-radius:16px; }
  .btn-submit{
    background:var(--coral);
    color:white;
    padding:0 22px;
    font-size:16px;
    box-shadow:0 6px 0 var(--coral-deep);
    transition:transform .08s;
  }
  .btn-submit:active{transform:translateY(4px); box-shadow:0 2px 0 var(--coral-deep);}
  .btn-submit:disabled{background:#CBD3E6; box-shadow:0 6px 0 #A9B3CC; cursor:default;}
  .kb-key:disabled, .kb-action:disabled, .btn-hint:disabled{ opacity:0.4; cursor:not-allowed; }

  .util-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); font-size:13px; padding:6px 10px; border-radius:10px; }
  .btn-ghost:hover{background:rgba(38,52,87,0.06);}
  .btn-hint{ background:#FFF3D0; color:#9A6B00; font-size:13px; padding:8px 14px; }

  .btn-mic{
    width:52px; flex:0 0 52px;
    background:var(--sky); color:white; font-size:20px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 0 #278A96;
  }
  .btn-mic:active{transform:translateY(4px); box-shadow:0 2px 0 #278A96;}
  .btn-mic.listening{ background:var(--coral); box-shadow:0 6px 0 var(--coral-deep); animation:mic-pulse 1s infinite; }
  .btn-mic:disabled{background:#CBD3E6; box-shadow:0 6px 0 #A9B3CC; cursor:not-allowed;}
  @keyframes mic-pulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  .voice-status{ text-align:center; font-size:12px; color:var(--sky); font-weight:700; min-height:16px; margin-bottom:4px; }

  .hint-card{
    display:none; align-items:center; gap:12px;
    background:#FFF7E0; border:2px dashed var(--sun);
    border-radius:18px; padding:12px 16px; margin:0 0 14px;
    box-shadow:var(--shadow);
  }
  .hint-card.show{ display:flex; animation:hint-pop .4s cubic-bezier(.34,1.56,.64,1); }
  .hint-card .hint-emoji{ font-size:40px; line-height:1; flex:0 0 auto; }
  .hint-card .hint-text{ flex:1; font-size:14px; color:#8A6300; font-weight:700; line-height:1.5; }
  .hint-card .hint-close{ flex:0 0 auto; background:transparent; color:#B08800; font-size:18px; padding:4px 8px; border-radius:8px; }
  .hint-card .hint-close:hover{background:rgba(176,136,0,0.12);}
  @keyframes hint-pop{
    0%{transform:scale(0.5) translateY(10px); opacity:0;}
    70%{transform:scale(1.05) translateY(-2px); opacity:1;}
    100%{transform:scale(1) translateY(0); opacity:1;}
  }

  .keyboard-wrap{
    background:var(--card); border-radius:20px;
    box-shadow:var(--shadow); padding:12px; margin:10px 0 14px;
  }
  .kb-tabs{ display:flex; gap:6px; margin-bottom:10px; }
  .kb-tab{ flex:1; background:var(--bg2); color:var(--ink-soft); font-size:12px; font-weight:700; padding:8px 4px; border-radius:10px; }
  .kb-tab.active{ background:var(--sun); color:var(--ink); }
  .kb-panel{ display:none; grid-template-columns:repeat(5, 1fr); gap:6px; }
  .kb-panel.active{display:grid;}
  .kb-key{
    background:var(--bg2); color:var(--ink);
    font-family:'Kosugi Maru', sans-serif; font-size:18px;
    padding:10px 0; border-radius:10px; transition:transform .06s;
  }
  .kb-key:active{transform:scale(0.9); background:#FFE9C7;}
  .kb-key.empty{visibility:hidden; pointer-events:none;}
  .kb-actions{ display:flex; gap:6px; margin-top:8px; }
  .kb-action{ flex:1; background:#EFE9FF; color:#6A4FCF; font-size:13px; padding:10px 0; }
  .kb-action.danger{background:#FFE3EA; color:var(--coral-deep);}

  .message{ text-align:center; font-size:13px; min-height:20px; margin:10px 0 4px; color:var(--coral-deep); font-weight:700; }
  .message.ok{color:var(--grass);}

  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
  @keyframes pop{ 0%{transform:scale(0.6); opacity:0;} 60%{transform:scale(1.06);} 100%{transform:scale(1); opacity:1;} }
  .pop{animation:pop .35s ease;}

  .overlay{
    position:fixed; inset:0; background:rgba(38,52,87,0.55);
    display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:10;
  }
  .overlay-card{
    background:var(--card); border-radius:26px; padding:32px 26px;
    max-width:360px; width:100%; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.3);
  }
  .overlay-card .big-emoji{font-size:56px; margin-bottom:8px;}
  .n-stamp{
    display:none; width:100px;height:100px; margin:0 auto 12px; border-radius:50%;
    border:5px solid var(--coral-deep); color:var(--coral-deep);
    align-items:center; justify-content:center; flex-direction:column;
    transform:rotate(-14deg); animation:stamp-in .4s cubic-bezier(.34,1.56,.64,1);
  }
  .n-stamp.show{display:flex;}
  .n-stamp .n-char{ font-family:'Kosugi Maru', sans-serif; font-size:34px; line-height:1; }
  .n-stamp .n-label{ font-size:11px; font-weight:900; letter-spacing:2px; margin-top:2px; }
  @keyframes stamp-in{ 0%{transform:rotate(-14deg) scale(2.2); opacity:0;} 60%{opacity:1;} 100%{transform:rotate(-14deg) scale(1); opacity:1;} }
  .overlay-btn-row{ display:flex; gap:10px; }
  .overlay-btn-row button{flex:1;}
  .btn-finish{ background:var(--card); color:var(--ink-soft); font-size:15px; padding:12px 10px; border:2px solid var(--line); }
  .btn-finish:active{transform:translateY(2px);}
  .overlay-card h2{ font-family:'Kosugi Maru', sans-serif; font-size:24px; margin:0 0 8px; }
  .overlay-card p{color:var(--ink-soft); font-size:14px; margin:0 0 20px; line-height:1.6;}
  .overlay-card .score-big{font-size:15px; margin-bottom:18px; color:var(--ink);}
  .overlay-card .score-big b{color:var(--coral-deep); font-size:20px;}
  .btn-restart{ background:var(--grass); color:white; font-size:16px; padding:12px 28px; box-shadow:0 6px 0 #2F8560; }
  .btn-restart:active{transform:translateY(4px); box-shadow:0 2px 0 #2F8560;}

  @media (max-width:420px){
    header h1{font-size:26px;}
    .stage-word{font-size:26px;}
    .stage-emoji{font-size:60px;}
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>🔗 しりとりあそび</h1>
  </header>

  <div class="scoreboard">
    <div class="pill player">🧒 きみ <span id="playerScore">0</span>こ</div>
    <div class="pill bot">🤖 あいて <span id="botScore">0</span>こ</div>
  </div>

  <div class="connector">
    <div class="kana-node" id="nodeFrom">ー</div>
    <div class="kana-node" id="nodeTo">？</div>
  </div>

  <div class="stage" id="stage">
    <span class="stage-tag bot" id="stageTag">さいしょの ことば</span>
    <div class="stage-emoji" id="stageEmoji">🎴</div>
    <div class="stage-word" id="stageWord">スタート</div>
  </div>

  <div class="chain-wrap">
    <p class="chain-label">これまでの チェーン</p>
    <div class="chain" id="chain"></div>
  </div>

  <div class="input-row">
    <button class="btn-mic" id="micBtn" title="おんせいにゅうりょく">🎤</button>
    <input type="text" id="wordInput" placeholder="キーボード・タッチ・マイクで入力" autocomplete="off" />
    <button class="btn-submit" id="submitBtn">きめる！</button>
  </div>
  <div class="voice-status" id="voiceStatus"></div>
  <div class="message" id="message"></div>

  <div class="keyboard-wrap">
    <div class="kb-tabs">
      <button class="kb-tab active" data-tab="main">あ〜わ行</button>
      <button class="kb-tab" data-tab="daku">が゛ ぱ゜</button>
      <button class="kb-tab" data-tab="small">ゃゅょっ ー</button>
    </div>

    <div class="kb-panel active" id="kbMain">
      <button class="kb-key" data-c="あ">あ</button><button class="kb-key" data-c="い">い</button><button class="kb-key" data-c="う">う</button><button class="kb-key" data-c="え">え</button><button class="kb-key" data-c="お">お</button>
      <button class="kb-key" data-c="か">か</button><button class="kb-key" data-c="き">き</button><button class="kb-key" data-c="く">く</button><button class="kb-key" data-c="け">け</button><button class="kb-key" data-c="こ">こ</button>
      <button class="kb-key" data-c="さ">さ</button><button class="kb-key" data-c="し">し</button><button class="kb-key" data-c="す">す</button><button class="kb-key" data-c="せ">せ</button><button class="kb-key" data-c="そ">そ</button>
      <button class="kb-key" data-c="た">た</button><button class="kb-key" data-c="ち">ち</button><button class="kb-key" data-c="つ">つ</button><button class="kb-key" data-c="て">て</button><button class="kb-key" data-c="と">と</button>
      <button class="kb-key" data-c="な">な</button><button class="kb-key" data-c="に">に</button><button class="kb-key" data-c="ぬ">ぬ</button><button class="kb-key" data-c="ね">ね</button><button class="kb-key" data-c="の">の</button>
      <button class="kb-key" data-c="は">は</button><button class="kb-key" data-c="ひ">ひ</button><button class="kb-key" data-c="ふ">ふ</button><button class="kb-key" data-c="へ">へ</button><button class="kb-key" data-c="ほ">ほ</button>
      <button class="kb-key" data-c="ま">ま</button><button class="kb-key" data-c="み">み</button><button class="kb-key" data-c="む">む</button><button class="kb-key" data-c="め">め</button><button class="kb-key" data-c="も">も</button>
      <button class="kb-key" data-c="や">や</button><button class="kb-key empty"></button><button class="kb-key" data-c="ゆ">ゆ</button><button class="kb-key empty"></button><button class="kb-key" data-c="よ">よ</button>
      <button class="kb-key" data-c="ら">ら</button><button class="kb-key" data-c="り">り</button><button class="kb-key" data-c="る">る</button><button class="kb-key" data-c="れ">れ</button><button class="kb-key" data-c="ろ">ろ</button>
      <button class="kb-key" data-c="わ">わ</button><button class="kb-key empty"></button><button class="kb-key" data-c="を">を</button><button class="kb-key empty"></button><button class="kb-key" data-c="ん">ん</button>
    </div>

    <div class="kb-panel" id="kbDaku">
      <button class="kb-key" data-c="が">が</button><button class="kb-key" data-c="ぎ">ぎ</button><button class="kb-key" data-c="ぐ">ぐ</button><button class="kb-key" data-c="げ">げ</button><button class="kb-key" data-c="ご">ご</button>
      <button class="kb-key" data-c="ざ">ざ</button><button class="kb-key" data-c="じ">じ</button><button class="kb-key" data-c="ず">ず</button><button class="kb-key" data-c="ぜ">ぜ</button><button class="kb-key" data-c="ぞ">ぞ</button>
      <button class="kb-key" data-c="だ">だ</button><button class="kb-key" data-c="ぢ">ぢ</button><button class="kb-key" data-c="づ">づ</button><button class="kb-key" data-c="で">で</button><button class="kb-key" data-c="ど">ど</button>
      <button class="kb-key" data-c="ば">ば</button><button class="kb-key" data-c="び">び</button><button class="kb-key" data-c="ぶ">ぶ</button><button class="kb-key" data-c="べ">べ</button><button class="kb-key" data-c="ぼ">ぼ</button>
      <button class="kb-key" data-c="ぱ">ぱ</button><button class="kb-key" data-c="ぴ">ぴ</button><button class="kb-key" data-c="ぷ">ぷ</button><button class="kb-key" data-c="ぺ">ぺ</button><button class="kb-key" data-c="ぽ">ぽ</button>
    </div>

    <div class="kb-panel" id="kbSmall">
      <button class="kb-key" data-c="ゃ">ゃ</button><button class="kb-key" data-c="ゅ">ゅ</button><button class="kb-key" data-c="ょ">ょ</button><button class="kb-key" data-c="っ">っ</button><button class="kb-key" data-c="ー">ー</button>
      <button class="kb-key" data-c="ぁ">ぁ</button><button class="kb-key" data-c="ぃ">ぃ</button><button class="kb-key" data-c="ぅ">ぅ</button><button class="kb-key" data-c="ぇ">ぇ</button><button class="kb-key" data-c="ぉ">ぉ</button>
    </div>

    <div class="kb-actions">
      <button class="kb-action" id="kbBack">⌫ もどす</button>
      <button class="kb-action danger" id="kbClear">🗑 ぜんぶけす</button>
    </div>
  </div>

  <div class="hint-card" id="hintCard">
    <div class="hint-emoji" id="hintEmoji">💡</div>
    <div class="hint-text" id="hintText">ヒントだよ</div>
    <button class="hint-close" id="hintClose">✕</button>
  </div>

  <div class="util-row">
    <button class="btn-ghost" id="resetBtn">↺ さいしょから</button>
    <button class="btn-hint" id="hintBtn">💡 ヒント</button>
  </div>
</div>

<div class="overlay" id="overlay" style="display:none;">
  <div class="overlay-card">
    <div class="big-emoji" id="overEmoji">🎉</div>
    <div class="n-stamp" id="nStamp">
      <span class="n-char">ん</span>
      <span class="n-label">STOP</span>
    </div>
    <h2 id="overTitle">きみの かち！</h2>
    <p id="overText">あいては つぎの ことばが おもいつかなかったよ。</p>
    <div class="score-big">つないだ ことば <b id="overScore">0</b> こ</div>
    <div class="overlay-btn-row">
      <button class="btn-finish" id="overFinish">ここで おわる</button>
      <button class="btn-restart" id="overRestart">もういちど あそぶ</button>
    </div>
  </div>
</div>

const DICT_BASE = [

  ["いけばな","💐"],["いし","🪨"],["いしがき","🧱"],["いしだん","🪜"],["いす","🪑"],
  ["いと","🧵"],["いぬ","🐶"],["いぬごや","🏠"],["いのち","❤️"],["いのしし","🐗"],
  ["いね","🌾"],["いも","🍠"],["いもむし","🐛"],["いやほん","🎧"],["いりぐち","🚪"],

function convertFullToHiragana(str) {
  if (!str) return "";
  let res = "";
  for (let i = 0; i < str.length; i++) {
    let code = str.charCodeAt(i);
    if (code >= 0x30A1 && code <= 0x30F6) {
      res += String.fromCharCode(code - 0x0060);
    }
    else if (code >= 0x30F7 && code <= 0x30FA) {
      res += String.fromCharCode(code - 0x0060);
    } else {
      res += str[i];
    }
  }
  return res;
}

  "猫":"ねこ","犬":"いぬ","空":"そら","海":"うみ","山":"やま","川":"かわ","花":"はな","木":"き",
  "雨":"あめ","雪":"ゆき","星":"ほし","月":"つき","日":"ひ","車":"くるま","船":"ふね","鳥":"とり",
  "魚":"さかな","虫":"むし","本":"ほん","手":"て","足":"あし","目":"め","耳":"みみ","口":"くち",
  "家":"いえ","石":"いし","紙":"かみ","箱":"はこ","風":"かぜ","光":"ひかり","赤":"あか","青":"あお",
  "黄":"きいろ","白":"しろ","黒":"くろ","緑":"みどり","桃":"もも","栗":"くり","柿":"かき",
  "猿":"さる","鹿":"しか","熊":"くま","象":"ぞう","虎":"とら","牛":"うし","馬":"うま","豚":"ぶた",
  "羊":"ひつじ","狐":"きつね","狸":"たぬき","蛙":"かえる","亀":"かめ","蛸":"たこ","烏賊":"いか",
  "蟹":"かに","蝦":"えび","貝":"かい","蝉":"せみ","蝶":"ちょう","蜂":"はち","蟻":"あり",
  "駅":"えき","町":"まち","道":"みち","橋":"はし","池":"いけ","森":"もり","林":"はやし",
  "昼":"ひる","夜":"よる","朝":"あさ","夕方":"ゆうがた","夏":"なつ","秋":"あき","冬":"ふゆ","春":"はる",
  "矢守":"やもり","家守":"やもり","忍者":"にんじゃ"
};

function normalizeText(input) {
  if(!input) return "";
  let text = input.trim();
  
  // 1. 漢字辞書変換
  for(let k in KANJI_MAP){
    text = text.replace(new RegExp(k, 'g'), KANJI_MAP[k]);
  }
  // 2. カタカナ -> ひらがな
  text = convertFullToHiragana(text);

  // 音声入力の「聞き間違い」救済ルール
  if(text === "あもり" || text === "あんもり" || text === "あもりー") text = "やもり";

  // 3. 辞書データに合致するものがあればその ひらがな に置換
  for(let [word, emoji] of DICT_BASE){
    if(text === word) return word;
  }
  // 4. ひらがな・伸ばし棒のみ抽出
  text = text.replace(/[^ぁ-んー]/g, '');
  return text;
}

const DICT = DICT_BASE.map(([word, emoji]) => ({ word, emoji }));

let history = [];
let currentWord = "";
let playerScore = 0;
let botScore = 0;
let isBotTurn = false;
let recognition = null;
let isListening = false;

const $ = id => document.getElementById(id);

// 語尾の文字を取得（「ゃ・ゅ・ょ」を「や・ゆ・よ」に正しいルールで大文字化）
function getDisplayLastChar(word){
  if (!word) return "";
  let last = word.slice(-1);
  if (last === 'ー' && word.length > 1) {
    last = word.slice(-2, -1);
  }
  // 修正ポイント：小文字から対応する大文字への正しい変換マップ
  const smallToBig = {
    'ゃ':'や', 'ゅ':'ゆ', 'ょ':'よ',
    'ぁ':'あ', 'ぃ':'い', 'ぅ':'う', 'ぇ':'え', 'ぉ':'お',
    'っ':'つ', 'ゎ':'わ'
  };
  return smallToBig[last] || last;
}

// 先頭の文字を取得
function getFirstChar(word){
  if (!word) return "";
  const smallToBig = {
    'ゃ':'や', 'ゅ':'ゆ', 'ょ':'よ',
    'ぁ':'あ', 'ぃ':'い', 'ぅ':'う', 'ぇ':'え', 'ぉ':'お',
    'っ':'つ', 'ゎ':'わ'
  };
  return smallToBig[word[0]] || word[0];
}

function findEmoji(word){
  const match = DICT.find(d => d.word === word);
  if(match) return match.emoji;
  return "✨";
}

function initGame(){
  history = [];
  playerScore = 0;
  botScore = 0;
  isBotTurn = false;
  $('playerScore').textContent = "0";
  $('botScore').textContent = "0";
  $('chain').innerHTML = "";
  $('message').textContent = "";
  $('wordInput').value = "";
  $('hintCard').classList.remove('show');

  const starters = DICT.filter(d => !d.word.endsWith("ん") && d.word.length >= 2);
  const startObj = starters[Math.floor(Math.random() * starters.length)];
  currentWord = startObj.word;
  
  pushHistory(currentWord, startObj.emoji, "bot");
  updateStage(currentWord, startObj.emoji, "あいての さいしょの ことば", false);
}

function updateStage(word, emoji, tagText, isPlayer){
  const stage = $('stage');
  const stageTag = $('stageTag');
  const stageEmoji = $('stageEmoji');
  const stageWord = $('stageWord');

  stageTag.textContent = tagText;
  stageTag.className = "stage-tag " + (isPlayer ? "player" : "bot");

  stageEmoji.textContent = emoji;
  
  const base = word.slice(0, -1);
  const end = word.slice(-1);
  
  if(end === 'ー' && word.length > 1){
    const base2 = word.slice(0, -2);
    const prev = word.slice(-2, -1);
    stageWord.innerHTML = `${base2}<span class="lastchar">${prev}</span>ー`;
  } else {
    stageWord.innerHTML = `${base}<span class="lastchar">${end}</span>`;
  }

  stage.classList.remove('pop');
  void stage.offsetWidth;
  stage.classList.add('pop');

  const required = getDisplayLastChar(word);
  $('nodeFrom').textContent = required;
  $('nodeTo').textContent = "？";
  $('nodeFrom').className = "kana-node active";
  $('nodeTo').className = "kana-node";
}

function pushHistory(word, emoji, who){
  history.push({ word, emoji, who });
  const item = document.createElement('div');
  item.className = 'chain-item';
  item.innerHTML = `
    <div class="chain-card by-${who}">
      <div class="em">${emoji}</div>
      <div class="wd">${word}</div>
    </div>
    <div class="link">➔</div>
  `;
  $('chain').appendChild(item);
  $('chain').scrollLeft = $('chain').scrollWidth;
}

function handlePlayerSubmit(){
  if(isBotTurn) return;
  
  const rawInput = $('wordInput').value;
  const cleaned = normalizeText(rawInput);
  const targetChar = getDisplayLastChar(currentWord);

  if(!cleaned){
    showError("ひらがなで ことばを 入力してね！");
    return;
  }

  if(getFirstChar(cleaned) !== targetChar){
    showError(`「${targetChar}」からはじまる ことばにしてね！`);
    return;
  }

  if(history.some(h => h.word === cleaned)){
    showError("そのことばは もう つかったよ！");
    return;
  }

  if(cleaned.endsWith("ん")){
    const emoji = findEmoji(cleaned);
    pushHistory(cleaned, emoji, "player");
    playerScore++;
    $('playerScore').textContent = playerScore;
    gameOver(false, "「ん」が ついちゃった！ きみの まけ！");
    return;
  }

  const emoji = findEmoji(cleaned);
  pushHistory(cleaned, emoji, "player");
  playerScore++;
  $('playerScore').textContent = playerScore;
  currentWord = cleaned;
  $('wordInput').value = "";
  $('message').textContent = "";
  $('hintCard').classList.remove('show');

  updateStage(cleaned, emoji, "きみの ことば！", true);

  isBotTurn = true;
  disableControls(true);
  setTimeout(botTurn, 1000 + Math.random() * 800);
}

function botTurn(){
  const targetChar = getDisplayLastChar(currentWord);
  
  const candidates = DICT.filter(d => {
    if(getFirstChar(d.word) !== targetChar) return false;
    if(history.some(h => h.word === d.word)) return false;
    return true;
  });

  if(candidates.length === 0){
    gameOver(true, "あいては つぎの ことばが おもいつかなかったよ！");
    return;
  }

  const safeCandidates = candidates.filter(d => !d.word.endsWith("ん"));
  let chosen;
  if(safeCandidates.length > 0 && Math.random() > 0.1){
    chosen = safeCandidates[Math.floor(Math.random() * safeCandidates.length)];
  } else {
    chosen = candidates[Math.floor(Math.random() * candidates.length)];
  }

  pushHistory(chosen.word, chosen.emoji, "bot");
  botScore++;
  $('botScore').textContent = botScore;
  currentWord = chosen.word;

  if(chosen.word.endsWith("ん")){
    updateStage(chosen.word, chosen.emoji, "あいての ことば", false);
    gameOver(true, "あいてが「ん」を つけたよ！ きみの かち！");
    return;
  }

  updateStage(chosen.word, chosen.emoji, "あいての ことば！ つぎは きみだよ", false);
  isBotTurn = false;
  disableControls(false);
}

function showError(msg){
  const m = $('message');
  m.textContent = msg;
  m.className = "message";
  $('nodeFrom').classList.add('bad');
  setTimeout(() => $('nodeFrom').classList.remove('bad'), 500);
}

function disableControls(disabled){
  $('submitBtn').disabled = disabled;
  $('wordInput').disabled = disabled;
  $('micBtn').disabled = disabled;
  $('hintBtn').disabled = disabled;
  document.querySelectorAll('.kb-key, .kb-action').forEach(b => b.disabled = disabled);
}

function gameOver(playerWon, reason){
  disableControls(true);
  const overlay = $('overlay');
  const overTitle = $('overTitle');
  const overText = $('overText');
  const overScore = $('overScore');
  const overEmoji = $('overEmoji');
  const nStamp = $('nStamp');

  overScore.textContent = playerScore;

  if(playerWon){
    overTitle.textContent = "🎉 きみの かち！";
    overEmoji.textContent = "🏆";
    nStamp.classList.remove('show');
  } else {
    overTitle.textContent = "😅 おしかったね！";
    overEmoji.textContent = "💥";
    nStamp.classList.add('show');
  }
  overText.textContent = reason;
  overlay.style.display = "flex";
}

function giveHint(){
  if(isBotTurn) return;
  const targetChar = getDisplayLastChar(currentWord);
  const candidates = DICT.filter(d => {
    if(getFirstChar(d.word) !== targetChar) return false;
    if(history.some(h => h.word === d.word)) return false;
    if(d.word.endsWith("ん")) return false;
    return true;
  });

  const card = $('hintCard');
  if(candidates.length === 0){
    $('hintEmoji').textContent = "🤔";
    $('hintText').textContent = "う〜ん、「" + targetChar + "」から はじまる ことばが 見つからないよ！";
  } else {
    const hintObj = candidates[Math.floor(Math.random() * candidates.length)];
    const hintLen = hintObj.word.length;
    $('hintEmoji').textContent = hintObj.emoji;
    $('hintText').textContent = `「${targetChar}」から はじまる ${hintLen}もじの ことば：「${hintObj.word[0]}…」があるよ！`;
  }
  card.classList.add('show');
}

function initSpeech(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    $('micBtn').style.display = "none";
    return;
  }
  recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onstart = () => {
    isListening = true;
    $('micBtn').classList.add('listening');
    $('voiceStatus').textContent = "🎙️ お話ししてね...";
  };

  recognition.onresult = (e) => {
    let transcript = e.results[0][0].transcript;
    let converted = normalizeText(transcript);
    $('wordInput').value = converted;
    $('voiceStatus').textContent = `「${converted || transcript}」って聞こえたよ！　漢字になってしまうときは手で入力してね。`;
  };

  recognition.onerror = () => {
    $('voiceStatus').textContent = "うまく 聞き取れなかったよ";
  };

  recognition.onend = () => {
    isListening = false;
    $('micBtn').classList.remove('listening');
    setTimeout(() => { $('voiceStatus').textContent = ""; }, 3000);
  };
}

document.addEventListener('DOMContentLoaded', () => {
  initGame();
  initSpeech();

  $('submitBtn').addEventListener('click', handlePlayerSubmit);
  $('wordInput').addEventListener('keydown', e => {
    if(e.key === 'Enter') handlePlayerSubmit();
  });

  $('micBtn').addEventListener('click', () => {
    if(!recognition) return;
    if(isListening){
      recognition.stop();
    } else {
      try { recognition.start(); } catch(err){}
    }
  });

  document.querySelectorAll('.kb-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.kb-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.kb-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      const targetId = "kb" + tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1);
      $(targetId).classList.add('active');
    });
  });

  document.querySelectorAll('.kb-key').forEach(key => {
    key.addEventListener('click', () => {
      const char = key.dataset.c;
      if(char) $('wordInput').value += char;
    });
  });

  $('kbBack').addEventListener('click', () => {
    const val = $('wordInput').value;
    $('wordInput').value = val.slice(0, -1);
  });

  $('kbClear').addEventListener('click', () => {
    $('wordInput').value = "";
  });

  $('hintBtn').addEventListener('click', giveHint);
  $('hintClose').addEventListener('click', () => {
    $('hintCard').classList.remove('show');
  });

  $('resetBtn').addEventListener('click', () => {
    disableControls(false);
    initGame();
  });

  $('overRestart').addEventListener('click', () => {
    $('overlay').style.display = "none";
    disableControls(false);
    initGame();
  });

  $('overFinish').addEventListener('click', () => {
    $('overlay').style.display = "none";
  });
});
</script>
