<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首振り絵本ビューア</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #book-container {
            position: relative;
            width: 85vw;
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #222;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .page-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }
        .page-img.active {
            display: block;
        }
        #camera-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            border: 2px solid #555;
            border-radius: 8px;
            overflow: hidden;
            transform: scaleX(-1); /* 鏡映像にする */
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #status {
            margin-top: 20px;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 20px;
        }
        #page-number {
            position: absolute;
            bottom: 20px;
            font-size: 1.1rem;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="book-container">
        <img src="01.jpg" class="page-img active">
        <img src="02.jpg" class="page-img">
        <img src="03.jpg" class="page-img">
        <img src="04.jpg" class="page-img">
        <img src="05.jpg" class="page-img">
        <img src="06.jpg" class="page-img">
        <img src="07.jpg" class="page-img">
        <img src="08.jpg" class="page-img">
        <img src="09.jpg" class="page-img">
        <img src="10.jpg" class="page-img">
        <img src="11.jpg" class="page-img">
        <img src="12.jpg" class="page-img">
        <img src="13.jpg" class="page-img">
        <img src="14.jpg" class="page-img">
        <img src="15.jpg" class="page-img">
        <img src="16.jpg" class="page-img">
        <img src="17.jpg" class="page-img">
        <img src="18.jpg" class="page-img">
        <img src="19.jpg" class="page-img">





 
        <div id="page-number">1 / 19</div>
    </div>

    <div id="status">カメラを読み込み中... 顔を正面に向けてください</div>

    <div id="camera-container">
        <video id="input-video"></video>
    </div>

    <script>
        const videoElement = document.getElementById('input-video');
        const statusElement = document.getElementById('status');
        const pageNumElement = document.getElementById('page-number');
        const pages = document.querySelectorAll('.page-img');
        
        let currentPage = 0;
        let isCoolDown = false; // 連続入力を防ぐクールダウン
        const COOL_DOWN_TIME = 1500; // 次のページをめくるまでの待機時間（ミリ秒）

        // ページ更新関数
        function updatePage(index) {
            if (index < 0 || index >= pages.length) return;
            pages[currentPage].classList.remove('active');
            currentPage = index;
            pages[currentPage].classList.add('active');
            pageNumElement.innerText = `${currentPage + 1} / ${pages.length}`;
        }

        // 首振りの判定ロジック
        function onResults(results) {
            if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
                statusElement.innerText = "顔が検出されません";
                return;
            }

            const landmarks = results.multiFaceLandmarks[0];
            
            // 鼻の頭(1), 左耳の横(234), 右耳の横(454) の座標を取得
            const nose = landmarks[1];
            const leftEar = landmarks[234];
            const rightEar = landmarks[454];

            // 顔の幅に対する鼻の位置の割合を計算
            const faceWidth = Math.abs(rightEar.x - leftEar.x);
            const noseRelativeX = (nose.x - leftEar.x) / faceWidth;

            if (isCoolDown) {
                statusElement.innerText = "（待機中...）";
                return;
            }

            statusElement.innerText = "正面を向いています。首を振ってページめくり";

            // しきい値の調整（環境に合わせて変更してください）
            // 鏡像にしているため、右を向くと数値が小さくなり、左を向くと大きくなります
            if (noseRelativeX < 0.35) { 
                // 右を向いた（次のページへ）
                if (currentPage < pages.length - 1) {
                    triggerPageFlip(currentPage + 1, "👉 次のページへ");
                }
            } else if (noseRelativeX > 0.65) {
                // 左を向いた（前のページへ）
                if (currentPage > 0) {
                    triggerPageFlip(currentPage - 1, "👈 前のページへ");
                }
            }
        }

        function triggerPageFlip(nextPage, message) {
            isCoolDown = true;
            statusElement.innerText = message;
            updatePage(nextPage);
            
            setTimeout(() => {
                isCoolDown = false;
            }, COOL_DOWN_TIME);
        }

        // MediaPipe Face Mesh の設定
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        faceMesh.onResults(onResults);

        // カメラの起動
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        camera.start().then(() => {
            statusElement.innerText = "準備完了！顔を左右に振ってみてください。";
        }).catch(err => {
            statusElement.innerText = "カメラの起動に失敗しました: " + err;
        });
    </script>
</body>
</html>
